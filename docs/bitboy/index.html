<style>
/* Layout: speelhal-avond. Links de tekst en Bitboy op zijn vloer, rechts de oranje handheld die je echt speelt. Daaronder paspoort, modelblad en doorverwijzingen. Bewust één donker thema, zoals Lijn ₿ en Museum ₿. */
:root{
  --void:#0B0604; --ink:#23150E; --paper:#EDE3D1; --paper-2:#F7F0E3; --dim:#BFAE98; --line:rgba(247,240,227,.16);
  --orange:#FF4D00; --gold:#C8952A;
  --hh:#E07A2E; --hh-hi:#EF8D41; --hh-lo:#C8641F; --plate:#F3E6C8; --hh-ink:#2B1B12; --lcd:#B4BA9A; --lcd-ink:#1C2018;
  --f-display:"Geist","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-px:"Geist Pixel Square","Geist Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html{overflow-x:clip}
[hidden]{display:none!important}
body{background:var(--void);color:var(--paper-2);font-family:var(--f-display);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:6px}
button{font:inherit;color:inherit}
em{font-family:var(--f-px);font-style:normal;font-weight:400;color:var(--orange);letter-spacing:-.02em}
.label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--void)}

/* topbalk */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(180deg,var(--void) 55%,rgba(11,6,4,0))}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:650;font-size:1.05rem;letter-spacing:-.02em;color:var(--paper-2);text-decoration:none}
.brand svg{width:34px;height:32px;border-radius:7px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(247,240,227,.35);color:var(--paper-2);border-radius:999px;padding:.62em 1.05em;display:inline-flex;align-items:center;gap:.5em;cursor:pointer;background:rgba(20,12,8,.6);text-decoration:none;white-space:nowrap}
.chip:hover{background:var(--paper-2);color:var(--ink)}
.chip.buy{background:var(--orange);border-color:var(--orange);color:var(--ink);font-weight:600}
.chip.buy:hover{background:var(--paper-2);border-color:var(--paper-2)}
.chip.lang [data-l]{opacity:.5}.chip.lang [data-l].on{opacity:1;color:var(--orange)}.chip.lang:hover [data-l].on{color:var(--ink)}
.chip.snd[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.chip.snd .on-t{display:none}.chip.snd[aria-pressed="true"] .on-t{display:inline}.chip.snd[aria-pressed="true"] .off-t{display:none}
.chip .bs{display:none}
@media (max-width:720px){.chip.ext{display:none}.chip.buy .bl{display:none}.chip.buy .bs{display:inline}.chip{padding:.55em .75em}.brand span{display:none}.chip.lang [data-l]:not(.on),.chip.lang i{display:none}}

/* held */
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(24px,4vw,64px);align-items:center;padding-block:clamp(24px,5vw,64px) clamp(40px,6vw,88px)}
.hero h1{font-size:clamp(3rem,8vw,6.6rem);line-height:.92;letter-spacing:-.045em;font-weight:750;margin:.35rem 0 1.1rem;text-wrap:balance}
.lead{font-size:clamp(1.05rem,1.6vw,1.22rem);max-width:34rem;color:var(--paper);margin:0;text-wrap:pretty}
.stage{position:relative;height:clamp(200px,24vw,268px);margin-top:clamp(16px,3vw,36px);max-width:36rem}
.floor{position:absolute;left:0;right:0;bottom:10px;height:1px;background:linear-gradient(90deg,transparent,var(--line) 18%,var(--line) 82%,transparent)}
.floor::after{content:"Bitboy · ₿-01";position:absolute;right:0;top:8px;font-family:var(--f-mono);font-size:.6rem;letter-spacing:.16em;color:var(--dim);opacity:.7;text-transform:uppercase}
.hero-bb{all:unset;position:absolute;right:6%;bottom:12px;height:calc(100% - 20px);aspect-ratio:256/312;cursor:pointer;opacity:0;transition:opacity .35s}
.hero-bb.on{opacity:1}
.hero-bb:focus-visible{outline:3px solid var(--orange);outline-offset:4px;border-radius:12px}
.bb-spr{position:absolute;inset:0;background-size:400% 300%;background-repeat:no-repeat;transform-origin:45% 100%;will-change:transform;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.bb-sh{position:absolute;left:10%;right:24%;bottom:-6px;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.7),transparent)}
.bb-eye{position:absolute;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;pointer-events:none}
.bb-pu{position:absolute;left:21%;top:19%;width:58%;height:62%;border-radius:50%;background:#192d1b;transition:transform .12s ease-out}
.bubble{position:absolute;right:calc(6% + clamp(150px,19vw,214px));bottom:42%;width:min(19rem,calc(100% - 150px));background:rgba(28,16,10,.92);border:1px solid rgba(255,77,0,.45);border-radius:14px 14px 4px 14px;padding:.75rem .95rem .85rem;opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s}
.bubble.on{opacity:1;transform:none}
.bubble .who{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.bubble p{margin:.25rem 0 0;font-size:.98rem;line-height:1.42;min-height:2.8em}

/* handheld */
.hero-dev{display:grid;gap:12px;justify-items:center;min-width:0}
.pk-dev{width:min(560px,100%);box-sizing:border-box;background:linear-gradient(165deg,var(--hh-hi) 0%,var(--hh) 45%,var(--hh-lo) 100%);border-radius:22px 22px 22px 70px;padding:16px 20px 20px;color:var(--hh-ink);box-shadow:0 34px 90px rgba(0,0,0,.6),0 0 120px rgba(255,77,0,.12),inset 0 -7px 0 rgba(90,35,8,.35),inset 0 2px 0 rgba(255,214,170,.6),inset 0 0 0 1px rgba(90,35,8,.35)}
.pk-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin:0 6px 12px}
.pk-brand{font-family:var(--f-px);font-size:1.05rem;letter-spacing:.02em;background:var(--plate);padding:.28em .55em .2em;border-radius:3px;box-shadow:inset 0 0 0 2px var(--hh-ink)}
.pk-model{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:#3A1A08;opacity:.85;text-align:right}
.pk-bezel{background:linear-gradient(180deg,#3B2A20,#2A1D16);border-radius:12px 12px 12px 34px;padding:14px 16px 10px;box-shadow:inset 0 2px 8px rgba(0,0,0,.7),0 0 0 3px var(--plate),0 0 0 4px rgba(90,35,8,.5)}
.pk-lcd{position:relative;aspect-ratio:16/9;background:linear-gradient(180deg,#BAC0A0,#A6AC8A);border-radius:4px;overflow:hidden;box-shadow:inset 0 0 22px rgba(0,0,0,.28);isolation:isolate;touch-action:manipulation;cursor:default}
.pk-lcd::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.04) 0 1px,transparent 1px 3px);pointer-events:none}
.pk-hint{font-family:var(--f-mono);font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(243,230,200,.55);margin-top:8px;display:flex;justify-content:space-between}
.lcd-t{position:absolute;font-family:var(--f-px);color:var(--lcd-ink);line-height:1}
.pk-msg{top:6%;left:4%;font-size:clamp(.66rem,2.3vw,.95rem);letter-spacing:.04em}
.pk-lost{top:15%;left:4%;font-size:clamp(.56rem,1.8vw,.75rem);opacity:.85}
.pk-score{top:5%;right:4%;font-size:clamp(1.1rem,4.4vw,1.8rem)}
.pk-score small{font-size:.5em;opacity:.55}
.pk-big{inset:22% 0 auto;text-align:center;font-size:clamp(1rem,4vw,1.7rem);letter-spacing:.04em;z-index:2;text-shadow:0 0 0 transparent}
.pk-big small{display:block;font-size:.5em;margin-top:.5em;opacity:.8}
.pk-big.blink{animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:0}}
.pk-lanes{position:absolute;left:3%;right:3%;top:24%;bottom:5%;display:grid;grid-template-columns:repeat(5,1fr);gap:1%}
.pk-lane{position:relative;display:flex;flex-direction:column;align-items:center;gap:3%;min-width:0}
.pk-c{display:grid;place-items:center;width:clamp(12px,3.4vw,21px);aspect-ratio:1;border-radius:50%;border:clamp(2px,.55vw,3px) solid var(--lcd-ink);color:var(--lcd-ink);font-family:var(--f-px);font-size:clamp(7px,1.9vw,11px);font-style:normal;opacity:.07;flex:none}
.pk-c::after{content:"₿"}

.pk-b{display:block;height:52%;aspect-ratio:256/312;margin-top:auto;background-size:400% 300%;background-repeat:no-repeat;mix-blend-mode:multiply;opacity:.08;transition:transform .1s}
.pk-b.on{opacity:.86}
.pk-lane.hit .pk-b{transform:translateY(-7%)}
.pk-x{position:absolute;right:2%;bottom:2%;width:clamp(10px,2.6vw,16px);aspect-ratio:1;border-radius:50%;border:2px solid var(--lcd-ink);opacity:.07}

@keyframes gl{0%{filter:none;transform:none}20%{filter:invert(1);transform:translateX(-3px) skewX(6deg)}40%{filter:hue-rotate(160deg) saturate(4);transform:translateX(4px)}60%{filter:invert(1) contrast(2);transform:skewX(-8deg)}80%{filter:brightness(3);transform:none}100%{filter:none}}
.pk-ctrl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;margin-top:16px;padding:0 6px}

.hof{width:min(560px,100%);box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;background:linear-gradient(180deg,rgba(255,77,0,.07),rgba(255,77,0,0) 70%)}

/* het spel */
const G={pos:2,coins:[],spawned:0,caught:0,lost:0,tick:0,next:1,iv:520,miss:[0,0,0,0,0],timer:0,last:-1};
function startGame(){
  if(mode==="play"||mode==="fly"||mode==="name") return;
  clearT(); dev.classList.remove("glitch"); clearTimeout(hideT);
  const begin=()=>{ Object.assign(G,{pos:2,coins:[],spawned:0,caught:0,lost:0,tick:0,next:1,iv:520,miss:[0,0,0,0,0],last:-1}); mode="play"; big(""); elMsg.textContent="BITBOY"; elLost.textContent=`${U("lost")} 0`; elScore.textContent="00"; bStart.textContent=U("start"); lcd(G.pos,[]); S.beep(990); G.timer=setTimeout(step,G.iv); };
  if(heroOn){ mode="fly"; say(U("go"),10,900); later(()=>flyIn(2,begin),550); } else begin();
}
function step(){
  if(mode!=="play") return;
  G.tick++; G.miss=G.miss.map(m=>Math.max(0,m-1));
  const keep=[];
  G.coins.forEach(c=>{ if(c.row===2){ if(G.pos===c.lane){ G.caught++; hit(c.lane); S.coin(); } else { G.lost++; G.miss[c.lane]=2; S.miss(); } } else { c.row++; keep.push(c); } });
  G.coins=keep;
  if(G.spawned<21&&G.tick>=G.next){ const free=[0,1,2,3,4].filter(l=>l!==G.last&&!G.coins.some(c=>c.lane===l&&c.row===0)); const l=free[Math.floor(Math.random()*free.length)]; G.coins.push({lane:l,row:0}); G.last=l; G.spawned++; const gap=G.spawned<6?3:G.spawned<14?(Math.random()<.5?2:3):2; G.next=G.tick+gap; if(!G.coins.some(c=>c.row>0)) S.beep(660); }
  G.iv=Math.max(300,520-G.caught*11-G.spawned*3);
  elScore.textContent=String(G.caught).padStart(2,"0"); elLost.textContent=`${U("lost")} ${G.lost}`;
  lcd(G.pos,G.coins,G.miss);
  if(G.spawned>=21&&!G.coins.length){ endGame(); return; }
  G.timer=setTimeout(step,G.iv);
}
function move(d){ if(mode==="name"){ nameStep(d); return; } if(mode!=="play") return; const n=clamp(G.pos+d,0,4); if(n===G.pos) return; G.pos=n; lcd(G.pos,G.coins,G.miss); S.beep(d<0?740:820); }
function endGame(){
  mode="fly"; clearTimeout(G.timer);
  const c=G.caught, l=G.lost; big(`${c}/21<small>${l} ${U("lost")}</small>`); elMsg.textContent=c===21?U("maxs"):"BITBOY";
  (c===21?S.win:S.end)();
  const prev=+(GET("bitboy.best")||0), qual=c>0&&c>Math.max(prev,HOF.mine||0);
  if(c>prev) PUT("bitboy.best",String(c)); showBest();
  const out=(d)=>{ later(()=>{ dev.classList.add("glitch"); },d); later(()=>{ dev.classList.remove("glitch"); flyOut(G.pos,()=>{ mode="idle"; bStart.textContent=U("again"); const key=c===21?"r21":c>=15?"rHi":c>=8?"rMid":"rLo"; say(U(key).replace("{c}",c).replace("{l}",l),c===21?10:c>=15?8:c>=8?2:4,3800,true); big(`${c}/21<small>${U("press")}</small>`); }); },d+350); };
  if(qual) later(()=>enterName(c,ini=>{ postScore(ini,c,l); big(`${c}/21<small>${ini}</small>`); out(500); }),1100);
  else out(1300);
}

/* ranglijst (gedeeld, één score per persoon) */
const HOF={db:null,uid:null,canW:null,rows:[],mine:0,ready:false};
const fmtDate=t=>{ try{ return new Date(t).toLocaleDateString(LANG==="en"?"en-GB":"nl-NL",{day:"numeric",month:"short"}); }catch(e){ return ""; } };
const cleanIni=v=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,3)||"???";
function hofRender(){
  const list=$("#hofList"), note=$("#hofNote");
  if(!HOF.db){ list.innerHTML=""; note.textContent=HOF.ready?U("hofNoDb"):U("hofLoad"); return; }
  const rows=HOF.rows.slice().sort((a,b)=>b.score-a.score||a.t-b.t);
  const myIdx=rows.findIndex(r=>r.id===HOF.uid);
  const li=(r,i)=>`<li class="${r.id===HOF.uid?"me ":""}${i===0?"first":""}"><span class="rk">${String(i+1).padStart(2,"0")}</span><span class="in">${esc(cleanIni(r.ini))}</span><span class="sc">${r.score}<small>/21</small></span><span class="dt">${r.id===HOF.uid?U("you")+" · ":""}${fmtDate(r.t)}</span></li>`;
  let html=rows.slice(0,10).map(li).join("");
  if(myIdx>=10) html+=`<li class="gap" aria-hidden="true">···</li>`+li(rows[myIdx],myIdx);
  list.innerHTML=html;
  if(!rows.length) note.textContent=U("hofEmpty"); else if(HOF.canW===false) note.textContent=U("hofRO"); else if(note.dataset.k!=="saved"&&note.dataset.k!=="fail") note.textContent="";
}
const esc=v=>String(v).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
async function hofInit(){
  let db=null,user=null;
  try{ if(window.claude&&window.claude.use){ [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]); } }catch(e){}
  HOF.ready=true;
  if(!db){ hofRender(); return; }
  HOF.db=db;
  try{ HOF.uid=user?await user.id():null; }catch(e){}
  try{ HOF.canW=user?await user.can("data.write"):null; }catch(e){}
  if(!HOF.uid) HOF.canW=false;
  hofRender();
  try{ db.collection("scores").orderBy("score","desc").limit(200).onSnapshot(snap=>{
      HOF.rows=snap.docs.filter(d=>d.exists).map(d=>{ const v=d.data()||{}; return {id:d.id,ini:v.ini,score:Math.max(0,Math.min(21,+v.score||0)),t:+v.t||0}; });
      const m=HOF.rows.find(r=>r.id===HOF.uid); HOF.mine=m?m.score:0; hofRender();
    },()=>{ HOF.db=null; hofRender(); }); }catch(e){ HOF.db=null; hofRender(); }
}
async function postScore(ini,c,l){
  const note=$("#hofNote");
  if(!HOF.db||!HOF.uid||HOF.canW===false){ hofRender(); return; }
  if(c<=HOF.mine) return;
  try{ await HOF.db.doc("scores/"+HOF.uid).set({ini,score:c,lost:l,t:Date.now()}); note.dataset.k="saved"; note.textContent=U("hofSaved"); }
  catch(e){ note.dataset.k="fail"; note.textContent=U("hofFail"); }
  setTimeout(()=>{ delete note.dataset.k; hofRender(); },6000);
}

  if(mode==="name"){ if(/^[a-z0-9]$/i.test(k)){ e.preventDefault(); nameType(k.toUpperCase()); } else if(k==="ArrowLeft"||k==="ArrowDown"){ e.preventDefault(); nameStep(-1); } else if(k==="ArrowRight"||k==="ArrowUp"){ e.preventDefault(); nameStep(1); } else if(k==="Enter"||k===" "){ e.preventDefault(); nameNext(); } else if(k==="Backspace"&&NM.i>0){ e.preventDefault(); NM.i--; drawName(); } return; }

$("#sheet").innerHTML=Array.from({length:12},(_,i)=>`<div class="card"><div class="fr"><span></span></div><button class="pose" type="button"><span class="bb-spr"></span></button><h3></h3><button class="dl" type="button" data-dl="${i}" hidden></button></div>`).join("");
const sheetSpr=$$("#sheet .bb-spr").map((el,i)=>sprite(el,i));
$$("#sheet .pose").forEach((b,i)=>b.addEventListener("click",()=>{ b.classList.remove("bounce"); void b.offsetWidth; b.classList.add("bounce"); S.boing(); }));

/* downloads */
let DL=null; const atlasImg=new Image(); atlasImg.src=IMG_BB;
(async()=>{ try{ if(window.claude&&window.claude.use) DL=await window.claude.use("downloads"); }catch(e){ DL=null; } if(DL){ $$("#sheet .dl").forEach(b=>b.hidden=false); $("#sheetActs").hidden=false; } })();
const toast=(m)=>{ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),2600); };
function drawPose(x,i,ox,oy){
  x.drawImage(atlasImg,(i%4)*256,Math.floor(i/4)*312,256,312,ox,oy,256,312);
  BBEYE[i].forEach(d=>{ const cx=ox+d[0]/100*256, cy=oy+d[1]/100*312, rx=d[2]/100*256/2, ry=d[3]/100*312/2; x.save(); x.beginPath(); x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); x.clip(); x.fillStyle="#192d1b"; x.beginPath(); x.ellipse(cx-rx*.32,cy+ry*.06,rx*.58,ry*.62,0,0,Math.PI*2); x.fill(); x.restore(); });
}
async function save(name,blob){ if(!DL) return; try{ const r=await DL.save({filename:name,data:blob}); if(r&&r.status==="saved") toast(U("saved")); }catch(e){ if(e&&e.code!=="declined") toast(U("dlFail")); } }
const canvasBlob=(w,h,fn)=>new Promise(res=>{ const c=document.createElement("canvas"); c.width=w; c.height=h; fn(c.getContext("2d")); c.toBlob(res,"image/png"); });
$("#sheet").addEventListener("click",async e=>{ const b=e.target.closest("[data-dl]"); if(!b) return; const i=+b.dataset.dl; const slug=T.nl.poses[i].toLowerCase().replace(/\s+/g,"-"); const blob=await canvasBlob(256,312,x=>drawPose(x,i,0,0)); save(`bitboy-${String(i+1).padStart(2,"0")}-${slug}.png`,blob); });
$("#dlSheet").addEventListener("click",async()=>{ const blob=await canvasBlob(1024,936,x=>{ for(let i=0;i<12;i++) drawPose(x,i,(i%4)*256,Math.floor(i/4)*312); }); save("bitboy-alle-houdingen.png",blob); });
$("#dlAvatar").addEventListener("click",()=>{ const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="19.13 50.69 97.68 92.41"><rect fill="#FF4D00" x="19.13" y="50.69" width="97.68" height="92.41"/>${SVG_BODY}</svg>`; save("bitboy-pasfoto.svg",new Blob([svg],{type:"image/svg+xml"})); });

/* taal + geluid */
$("#langBtn").addEventListener("click",()=>{ LANG=LANG==="nl"?"en":"nl"; PUT("bitboy.lang",LANG); renderStatic(); bubble.classList.remove("on"); });
const sb=$("#sndBtn"); sb.setAttribute("aria-pressed",SND?"true":"false");
sb.addEventListener("click",()=>{ SND=!SND; PUT("bitboy.snd",SND?"1":"0"); sb.setAttribute("aria-pressed",SND?"true":"false"); if(SND) S.beep(880); });

/* lus */
function loop(now){
  heroTick(now); if(heroOn) look(heroSpr,false,now);
  sheetSpr.forEach(el=>look(el,false,now));
  requestAnimationFrame(loop);
}
renderStatic(); requestAnimationFrame(loop); hofInit();
if(REDUCED){ heroOn=true; heroBB.classList.add("on"); idleScreen(); say(U("intro1"),8,3600,false); }
else setTimeout(demo,500);
})();
</script>
