<style>
/* Layout: één doorlopend gebouw in 3D (oude stenen architectuur, nieuwe hologrammen); scrollen is zweven. Bovenop: topbalk, HUD-bordjes, personeel met spraakballon en dialoog, plattegrond per verdieping. Daarna een HTML-uitgang met de hele collectie. Bewust één donker thema. */
:root{
  --void:#0B0604; --ink:#23150E; --paper:#EDE3D1; --paper-2:#F7F0E3; --dim:#BFAE98;
  --orange:#FF4D00; --pink:#F06FA0; --gold:#C8952A;
  --f-display:"Geist","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-px:"Geist Pixel Square","Geist Mono",ui-monospace,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
html{overflow-x:clip}
[hidden]{display:none!important}
html.locked{overflow:hidden}
body{background:var(--void);color:var(--paper-2);font-family:var(--f-display);font-size:17px;line-height:1.55;padding-left:var(--gl);padding-right:var(--gr);-webkit-font-smoothing:antialiased;overflow-x:clip}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:6px}
button{font:inherit;color:inherit}
em{font-family:var(--f-px);font-style:normal;font-weight:400;color:var(--orange);letter-spacing:-.02em}
.label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#gl.tap{cursor:pointer}
.walk{position:relative;z-index:1;pointer-events:none}
.hud{background:linear-gradient(140deg,rgba(28,16,10,.84),rgba(14,8,5,.76));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,77,0,.35);border-radius:4px;position:relative}
.hud::before,.hud::after{content:"";position:absolute;width:14px;height:14px;border-color:var(--orange);border-style:solid;pointer-events:none}
.hud::before{left:-1px;top:-1px;border-width:2px 0 0 2px}
.hud::after{right:-1px;bottom:-1px;border-width:0 2px 2px 0}

.topbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) var(--gr) 14px var(--gl);pointer-events:none}
.topbar > *{pointer-events:auto}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:1.05rem;letter-spacing:-.02em;text-decoration:none;color:var(--paper-2)}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--orange);color:var(--ink);display:grid;place-items:center;font-family:var(--f-px);font-size:1rem}
.top-actions{display:flex;gap:8px;align-items:center}
.chip{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(247,240,227,.35);color:var(--paper-2);border-radius:999px;padding:.62em 1.05em;display:inline-flex;align-items:center;gap:.55em;cursor:pointer;background:rgba(20,12,8,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);text-decoration:none;white-space:nowrap}
.chip:hover{background:var(--paper-2);color:var(--ink)}
.chip.solid{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.chip svg{width:14px;height:14px}
.chip.snd .w{display:none}.chip.snd[aria-pressed="true"] .w{display:inline}.chip.snd[aria-pressed="true"] .x{display:none}
.chip.buy{background:var(--orange);border-color:var(--orange);color:var(--ink);font-weight:600}.chip.buy:hover{background:var(--paper-2);border-color:var(--paper-2)}.chip.buy .bs{display:none}
@media (max-width:560px){.chip.buy .bl{display:none}.chip.buy .bs{display:inline}.chip.buy{text-transform:none;letter-spacing:0;padding:.55em .8em;font-size:.74rem}.chip.buy > span[aria-hidden]{display:none}.topbar .chip{padding:.55em .75em}.brand span:last-child{display:none}.chip.lang [data-l]:not(.on),.chip.lang [aria-hidden]{display:none}.top-actions{gap:6px}}
.chip.lang{gap:.3em}.chip.lang [data-l]{opacity:.5}.chip.lang [data-l].on{opacity:1;color:var(--orange)}.chip.lang:hover [data-l].on{color:var(--ink)}
.seg{display:flex;gap:4px;margin-top:.2rem}.seg button{flex:1;justify-content:center;border:1px solid rgba(247,240,227,.3)!important;border-radius:999px;padding:.3rem .5rem!important;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase}.seg button[aria-pressed="true"]{background:var(--orange);color:var(--ink)!important;border-color:var(--orange)!important}
.chip.snd[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:var(--ink)}
@media (max-width:560px){.chip .txt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}

.intro{position:fixed;z-index:10;left:0;right:0;bottom:clamp(40px,9vh,100px);padding-inline:max(var(--gl),clamp(16px,5vw,80px));pointer-events:none}
.mega{font-size:clamp(3rem,8.4vw,8.8rem);line-height:.86;letter-spacing:-.06em;font-weight:700;margin:.5rem 0 0}
.intro p{margin:1.2rem 0 0;font-size:clamp(1.05rem,1.4vw,1.25rem);max-width:28em;color:var(--paper)}
.scrollhint{display:inline-flex;align-items:center;gap:.7rem;margin-top:1.4rem;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--paper)}
.scrollhint i{width:26px;height:26px;border:1.5px solid var(--orange);border-radius:50%;display:grid;place-items:center;font-style:normal;color:var(--orange);animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}

.zonecard{position:fixed;z-index:11;left:50%;top:22%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .6s,transform .6s;padding:.9rem 1.6rem 1rem}
.zonecard.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.zonecard .zl{display:block;font-family:var(--f-px);color:var(--orange);font-size:.95rem;letter-spacing:.12em}
.zonecard b{display:block;font-size:clamp(1.8rem,3.6vw,3rem);font-weight:600;letter-spacing:-.05em;line-height:1}
.zonecard small{display:block;margin-top:.35rem;color:var(--dim);font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}

.placard{position:fixed;z-index:12;left:max(var(--gl),clamp(16px,4vw,64px));bottom:clamp(24px,6vh,60px);width:min(26rem,calc(100vw - 32px));padding:1.1rem 1.25rem 1.2rem;opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .4s,transform .4s,visibility .4s}
.placard.on{opacity:1;visibility:visible;transform:none}
.pl-top{display:flex;align-items:baseline;gap:.8rem}
.pl-no{font-family:var(--f-px);font-size:1.6rem;line-height:1;color:var(--orange)}
.pl-meta{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.placard h3{margin:.5rem 0 .3rem;font-size:1.35rem;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.placard p{margin:0;font-size:.98rem;line-height:1.45;color:var(--paper);min-height:2.9em}
.pl-ai{display:inline-block;margin-top:.6rem;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border:1px solid rgba(247,240,227,.25);border-radius:3px;padding:.2em .45em}
.pl-links{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.9rem}
.lk{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(247,240,227,.45);border-radius:999px;padding:.55em .95em;background:transparent;cursor:pointer;text-decoration:none;color:var(--paper-2)}
.lk:hover{background:var(--paper-2);color:var(--ink)}
.lk.world,.lk.hot{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.lk.world:hover,.lk.hot:hover{background:var(--paper-2);border-color:var(--paper-2)}

.bubble{position:fixed;z-index:13;left:0;top:0;width:min(17rem,70vw);padding:.75rem .9rem .85rem;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;will-change:transform}
.bubble.on{opacity:1;visibility:visible}
.bubble .who{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--pink)}
.bubble p{margin:.3rem 0 .6rem;font-size:.95rem;line-height:1.4}

 /* Zaal 1 */
 {id:"001",z:"z1",block:"Vóór blok 0",date:"31 okt 2008",title:"De whitepaper van Satoshi",ai:true,kind:"photo",text:"Negen pagina's, gestuurd naar een mailinglijst over cryptografie. Afzender: Satoshi Nakamoto. Niemand weet wie dat is.",long:["De whitepaper beschrijft in negen pagina's hoe digitaal geld kan werken zonder bank. Iedereen houdt samen één kasboek bij, en een loterij met rekenwerk bepaalt wie er mag schrijven.","Satoshi stuurde het stuk op 31 oktober 2008 naar een mailinglijst over cryptografie. De reacties waren kritisch: zou dit ooit schaal kunnen halen? Satoshi bleef rustig antwoorden.","Het idee stond niet op zichzelf. Satoshi bouwde voort op eerdere pogingen zoals Hashcash en b-money, maar loste als eerste het probleem op dat je digitaal geld niet twee keer kunt uitgeven zonder dat een bank dat controleert.","De titel: Bitcoin: A Peer-to-Peer Electronic Cash System. Hij staat nog steeds op bitcoin.org en is in tientallen talen vertaald."],world:["geld","De planeet"],src:"Beeld: digitaal nagemaakt object. Tekst: bitcoin.org.",
  en:{block:"Before block 0",date:"31 Oct 2008",title:"Satoshi's whitepaper",text:"Nine pages, sent to a mailing list about cryptography. Sender: Satoshi Nakamoto. Nobody knows who that is.",long:["In nine pages, the whitepaper describes how digital money can work without a bank. Everyone keeps one shared ledger, and a lottery of computing work decides who gets to write in it.","Satoshi sent the paper to a cryptography mailing list on 31 October 2008. The replies were sceptical: could this ever scale? Satoshi kept answering calmly.","The idea did not come out of nowhere. Satoshi built on earlier attempts such as Hashcash and b-money, but was the first to solve the problem of spending digital money twice without a bank checking it.","The title: Bitcoin: A Peer-to-Peer Electronic Cash System. It is still on bitcoin.org and has been translated into dozens of languages."],src:"Image: digitally recreated object. Text: bitcoin.org."}},
 {id:"002",z:"z1",block:"Blok 0",date:"3 jan 2009",title:"Het genesisblok: blok 0",kind:"genesis",text:"Het allereerste blok. Satoshi zette er een krantenkop in, als tijdstempel en als statement.",long:["In blok 0 staat de kop van The Times van die dag: de Britse minister van Financiën stond op het punt banken voor de tweede keer te redden.","Het was midden in de financiële crisis. Overheden pompten miljarden in banken die te groot waren om om te vallen. De kop bewijst dat het blok niet vóór 3 januari 2009 gemaakt kan zijn, en laat zien waar Satoshi een alternatief voor wilde bouwen.","Wie een blok maakt, krijgt een beloning. Voor dit eerste blok was dat 50 bitcoin. Die kan niemand ooit uitgeven: de software telt ze niet mee. Bewust van Satoshi of een foutje? Niemand weet het. Ze liggen er voor altijd, als in een vitrine."],world:["ketting","Blokkenstad"],src:"Blokdata. Hash nagerekend.",
  en:{block:"Block 0",date:"3 Jan 2009",title:"The genesis block: block 0",text:"The very first block. Satoshi put a newspaper headline in it, as a timestamp and as a statement.",long:["Block 0 contains that day's headline from The Times: the British finance minister was about to rescue the banks for a second time.","It was the middle of the financial crisis. Governments were pouring billions into banks that were too big to fail. The headline proves the block cannot have been made before 3 January 2009, and shows what Satoshi wanted to build an alternative to.","Whoever makes a block gets a reward. For this first block, that was 50 bitcoin. Nobody can ever spend them: the software does not count them. Deliberate by Satoshi or a bug? Nobody knows. They sit there forever, as if in a display case."],src:"Block data. Hash recalculated."}},
 {id:"003",z:"z1",block:"± Blok 110",date:"10 jan 2009",title:"„Running bitcoin”: de tweede gebruiker",kind:"laser",text:"Hal Finney draaide als eerste naast Satoshi de software. Hij meldde het in twee woorden.",long:["Hal Finney was een cryptograaf uit Californië. Hij zette in de eerste week zijn computer aan het werk.","Hij was een van de weinigen die meteen reageerde op de whitepaper. Hij testte de software, meldde fouten en mailde met Satoshi over verbeteringen.","Zijn bericht „Running bitcoin” op 10 januari 2009 wordt gezien als het eerste teken dat bitcoin niet alleen Satoshi's project was.","Kort daarna kreeg Finney de spierziekte ALS. Hij bleef programmeren met een oogbesturing. Hij overleed in 2014."],world:["kasboek","Het netwerk"],src:"Citaat zoals gepubliceerd door Hal Finney.",
  en:{block:"± Block 110",date:"10 Jan 2009",title:"“Running bitcoin”: the second user",text:"Hal Finney was the first person besides Satoshi to run the software. He announced it in two words.",long:["Hal Finney was a cryptographer from California. He put his computer to work in the very first week.","He was one of the few who responded to the whitepaper straight away. He tested the software, reported bugs and emailed Satoshi about improvements.","His message “Running bitcoin” on 10 January 2009 is seen as the first sign that bitcoin was not just Satoshi's project.","Soon after, Finney was diagnosed with ALS. He kept programming using eye tracking. He died in 2014."],src:"Quote as published by Hal Finney."}},
 {id:"004",z:"z1",block:"Blok 170",date:"12 jan 2009",title:"De eerste bitcoinbetaling",kind:"coin",text:"Satoshi stuurt 10 bitcoin naar Hal Finney. De eerste keer dat bitcoin van eigenaar wisselt.",long:["Negen dagen na blok 0 stuurde Satoshi 10 bitcoin naar Hal Finney, als test. De transactie staat in blok 170.","Er was geen bank, geen formulier en geen tussenpersoon. Satoshi ondertekende de betaling met zijn sleutel, en het netwerk controleerde zelf of het klopte.","Bitcoin had toen geen prijs. Die 10 bitcoin waren niets waard in dollars. Het ging erom te bewijzen dat het werkte.","De transactie-ID in de ring kan iedereen vandaag nog opzoeken. Op het scherm hiernaast zie je de echte bytes."],world:["betalen","Het station"],src:"Blokdata, blok 170.",
  en:{block:"Block 170",date:"12 Jan 2009",title:"The first bitcoin payment",text:"Satoshi sends 10 bitcoin to Hal Finney. The first time bitcoin changes hands.",long:["Nine days after block 0, Satoshi sent 10 bitcoin to Hal Finney as a test. The transaction is in block 170.","There was no bank, no form and no middleman. Satoshi signed the payment with his key, and the network checked for itself that it was valid.","Bitcoin had no price back then. Those 10 bitcoin were worth nothing in dollars. The point was to prove it worked.","Anyone can still look up the transaction ID in the ring today. The screen next to it shows the real bytes."],src:"Block data, block 170."}},
 {id:"005",z:"z1",block:"Vóór blok 0",date:"2008",title:"Delven op een laptop",kind:"laptop",text:"Zo'n computer delfde de eerste blokken. Een gewone processor was toen genoeg.",long:["In 2009 kon je met een gewone laptop bitcoin delven. Er deden maar een handvol mensen mee.","Satoshi's eerste software, Bitcoin v0.1, kwam uit op 9 januari 2009 en draaide alleen op Windows. Eén vinkje, Generate Coins, en je laptop deed mee met de loterij.","Elk gevonden blok leverde 50 bitcoin op. Omdat bijna niemand meedeed, vond een laptop er soms meerdere per dag.","Veel van die vroege munten zijn nooit meer bewogen. De eigenaren zijn hun bestanden kwijt, of wachten nog steeds."],world:["loterij","De mijnhal"],src:"Hologram nagebouwd naar het venster van Bitcoin v0.1 (januari 2009).",
  en:{block:"Before block 0",date:"2008",title:"Mining on a laptop",text:"A computer like this mined the first blocks. An ordinary processor was enough.",long:["In 2009 you could mine bitcoin with an ordinary laptop. Only a handful of people took part.","Satoshi's first software, Bitcoin v0.1, came out on 9 January 2009 and only ran on Windows. One tick box, Generate Coins, and your laptop joined the lottery.","Every block found earned 50 bitcoin. Because hardly anyone took part, a laptop could sometimes find several a day.","Many of those early coins have never moved again. Their owners lost their files, or are still waiting."],src:"Hologram rebuilt from the Bitcoin v0.1 window (January 2009)."}},
 {id:"006",z:"z1",block:"± Blok 118.000",date:"23 apr 2011",title:"Satoshi's laatste bericht",kind:"decay",text:"Satoshi's laatste bekende bericht, in een e-mail aan een ontwikkelaar. Daarna: stilte.",long:["Satoshi schreef op 23 april 2011 aan ontwikkelaar Mike Hearn dat hij met andere dingen bezig was. Op het forum was hij al sinds december 2010 stil.","Daarvoor had hij het werk overgedragen. Ontwikkelaar Gavin Andresen kreeg de sleutels van de code en van het waarschuwingssysteem.","Waarom hij stopte, weet niemand. Een veelgehoorde gedachte: zonder bekende oprichter is er niemand die je kunt dwingen, omkopen of arresteren. Het netwerk moest op eigen benen staan.","De zo'n 1,1 miljoen bitcoin die Satoshi naar schatting delfde, zijn nooit bewogen."],world:["walvissen","De oceaan"],src:"Citaat zoals gepubliceerd door Mike Hearn.",
  en:{block:"± Block 118,000",date:"23 Apr 2011",title:"Satoshi's last message",text:"Satoshi's last known message, in an email to a developer. After that: silence.",long:["On 23 April 2011, Satoshi wrote to developer Mike Hearn that he had moved on to other things. On the forum he had been silent since December 2010.","Before that, he had handed over the work. Developer Gavin Andresen received the keys to the code and to the alert system.","Why he stopped, nobody knows. A common thought: without a known founder there is nobody to pressure, bribe or arrest. The network had to stand on its own feet.","The roughly 1.1 million bitcoin Satoshi is estimated to have mined have never moved."],src:"Quote as published by Mike Hearn."}},
 /* Zaal 2 */
 {id:"007",z:"z2",block:"± Blok 25.000",date:"5 okt 2009",title:"De eerste bitcoinkoers",kind:"rate",text:"Iemand rekent uit wat bitcoin waard is: de stroom die het kost om te delven. Uitkomst: 1 dollar is 1.309 bitcoin.",long:["De site New Liberty Standard publiceerde op 5 oktober 2009 de eerste wisselkoers. De berekening was simpel: wat kost de stroom van een computer die een jaar lang bitcoin delft?","Voor één dollar kreeg je 1.309,03 bitcoin. Eén bitcoin was dus minder dan een tiende cent waard.","Het was geen markt zoals nu, met kopers en verkopers die de hele dag handelen. Het was een eerste poging om bitcoin een prijs te geven, gebaseerd op de kosten om het te maken.","Dat idee, dat bitcoin iets kost om te maken, keert later steeds terug in discussies over wat het waard is."],world:["kosten","De energie"],src:"New Liberty Standard, oktober 2009.",
  en:{block:"± Block 25,000",date:"5 Oct 2009",title:"The first bitcoin price",text:"Someone works out what bitcoin is worth: the electricity it takes to mine. Result: 1 dollar is 1,309 bitcoin.",long:["On 5 October 2009, the site New Liberty Standard published the first exchange rate. The calculation was simple: what does the electricity cost for a computer mining bitcoin for a year?","For one dollar you got 1,309.03 bitcoin. So one bitcoin was worth less than a tenth of a cent.","It was not a market like today, with buyers and sellers trading all day. It was a first attempt to give bitcoin a price, based on the cost of making it.","That idea, that bitcoin costs something to make, keeps coming back in debates about what it is worth."],src:"New Liberty Standard, October 2009."}},
 {id:"008",z:"z2",block:"Blok 57.043",date:"22 mei 2010",title:"Twee pizza's voor 10.000 bitcoin",kind:"pizza",text:"Laszlo Hanyecz betaalt 10.000 bitcoin voor twee pizza's. De eerste keer dat bitcoin iets echts koopt.",long:["Laszlo Hanyecz bood op een forum 10.000 bitcoin aan voor twee pizza's. Iemand bestelde ze voor hem en kreeg de bitcoin.","De koper was Jeremy Sturdivant, toen 19. Hij betaalde zo'n 25 dollar voor de pizza's bij Papa John's. De 10.000 bitcoin waren toen ongeveer 41 dollar waard.","Het was de eerste keer dat bitcoin iets echts kocht. Daarmee werd het meer dan een experiment: het was geld waar je iets voor kon krijgen.","Elk jaar op 22 mei vieren mensen Bitcoin Pizza Day. Laszlo zegt zelf dat hij geen spijt heeft: iemand moest de eerste zijn."],world:["betalen","Het station"],src:"Blokdata, blok 57.043.",
  en:{block:"Block 57,043",date:"22 May 2010",title:"Two pizzas for 10,000 bitcoin",text:"Laszlo Hanyecz pays 10,000 bitcoin for two pizzas. The first time bitcoin buys something real.",long:["Laszlo Hanyecz offered 10,000 bitcoin on a forum for two pizzas. Someone ordered them for him and got the bitcoin.","The buyer was Jeremy Sturdivant, then 19. He paid around 25 dollars for the pizzas from Papa John's. The 10,000 bitcoin were worth about 41 dollars at the time.","It was the first time bitcoin bought something real. That made it more than an experiment: it was money you could get something for.","Every year on 22 May, people celebrate Bitcoin Pizza Day. Laszlo himself says he has no regrets: somebody had to be first."],src:"Block data, block 57,043."}},
 {id:"009",z:"z2",block:"± Blok 68.000",date:"juli 2010",title:"Mt. Gox wordt een bitcoinbeurs",kind:"exchange",text:"Een site om ruilkaarten te verhandelen wordt een bitcoinbeurs. Vier jaar later is het de grootste ter wereld.",long:["Mt. Gox werd in juli 2010 een plek om bitcoin te kopen en verkopen. De naam kwam van een eerder plan: een site om Magic-ruilkaarten te verhandelen.","Oprichter Jed McCaleb verkocht de beurs in 2011 aan Mark Karpelès, een Fransman in Tokio. Mt. Gox groeide snel en verwerkte op zijn hoogtepunt het grootste deel van alle bitcoinhandel ter wereld.","Voor veel mensen was het de enige manier om bitcoin te kopen. Daardoor bewaarden ze hun bitcoin ook op de beurs zelf, en niet in hun eigen wallet.","Hoe het afliep, zie je beneden in Zaal 4."],world:["walvissen","De oceaan"],src:"Publieke bronnen over Mt. Gox.",
  en:{block:"± Block 68,000",date:"July 2010",title:"Mt. Gox becomes a bitcoin exchange",text:"A site for trading collectible cards becomes a bitcoin exchange. Four years later it is the biggest in the world.",long:["Mt. Gox became a place to buy and sell bitcoin in July 2010. The name came from an earlier plan: a site for trading Magic cards.","Founder Jed McCaleb sold the exchange in 2011 to Mark Karpelès, a Frenchman in Tokyo. Mt. Gox grew fast and at its peak handled most of the world's bitcoin trading.","For many people it was the only way to buy bitcoin. So they also kept their bitcoin on the exchange itself, not in their own wallet.","How it ended, you can see downstairs in Room 4."],src:"Public sources on Mt. Gox."}},
 {id:"010",z:"z2",block:"Blok 74.638",date:"15 aug 2010",title:"De bug van 184 miljard bitcoin",kind:"overflow",text:"Een fout in de code maakt in één blok ruim 184 miljard bitcoin aan. Binnen een paar uur is het hersteld.",long:["Door een rekenfout kon iemand op 15 augustus 2010 een transactie maken met 184.467.440.737 bitcoin. Ver boven het maximum van 21 miljoen.","De fout zat in de controle van bedragen: twee enorme getallen bij elkaar opgeteld liepen over, en de software zag het resultaat als klein en geldig.","Ontwikkelaars, met Satoshi voorop, brachten binnen een paar uur een nieuwe versie uit. Miners stapten over, en het netwerk ging verder vanaf een blok zonder die fout.","Het is tot nu toe de ernstigste fout in de geschiedenis van bitcoin. Hij laat ook zien waarom ontwikkelaars sindsdien zo voorzichtig zijn met veranderingen."],world:["ketting","Blokkenstad"],src:"Blokdata, blok 74.638.",
  en:{block:"Block 74,638",date:"15 Aug 2010",title:"The 184 billion bitcoin bug",text:"A bug in the code creates over 184 billion bitcoin in one block. Within a few hours it is fixed.",long:["Because of a calculation bug, someone was able to create a transaction with 184,467,440,737 bitcoin on 15 August 2010. Far above the 21 million maximum.","The bug was in how amounts were checked: two huge numbers added together overflowed, and the software saw the result as small and valid.","Developers, led by Satoshi, released a new version within a few hours. Miners switched over, and the network continued from a block without the bug.","It is still the most serious bug in bitcoin's history. It also shows why developers have been so careful with changes ever since."],src:"Block data, block 74,638."}},
 /* Zaal 3 */
 {id:"011",z:"z3",block:"Blok 0 →",date:"2009",title:"Delven met een gewone processor",kind:"tower",text:"In het begin delfde iedereen met de processor van een gewone computer.",long:["In 2009 en 2010 was een gewone processor genoeg. Er deden maar een paar mensen mee.","Een processor is goed in veel verschillende taken, maar doet ze een voor een. Voor mining moet je steeds dezelfde berekening herhalen, zo snel mogelijk.","Hoe meer mensen meededen, hoe moeilijker de loterij werd. Het netwerk past de moeilijkheid elke 2.016 blokken aan, zodat er gemiddeld elke tien minuten een blok bijkomt.","Met een gewone pc delven is nu kansloos: de kans dat je een blok vindt is kleiner dan de kans op de hoofdprijs in de loterij."],world:["loterij","De mijnhal"],src:"Algemene geschiedenis van mining.",
  en:{block:"Block 0 →",date:"2009",title:"Mining with an ordinary processor",text:"In the beginning, everyone mined with the processor of an ordinary computer.",long:["In 2009 and 2010, an ordinary processor was enough. Only a few people took part.","A processor is good at many different tasks, but does them one by one. Mining means repeating the same calculation over and over, as fast as possible.","The more people joined, the harder the lottery became. The network adjusts the difficulty every 2,016 blocks, so that a block is added on average every ten minutes.","Mining with a normal PC is hopeless today: your chance of finding a block is smaller than winning the jackpot."],src:"General history of mining."}},
 {id:"012",z:"z3",block:"± Blok 85.000",date:"2010",title:"Delven met een videokaart",kind:"gpu",text:"Miners ontdekken dat een videokaart veel sneller gokt. Kamers vol rekken met kaarten.",long:["Een videokaart kan duizenden kleine sommen tegelijk doen. Precies wat mining nodig heeft.","In 2010 verschenen de eerste programma's om met een videokaart te delven. Een kaart was tientallen keren sneller dan een processor.","Mensen bouwden rekken met zes kaarten naast elkaar, met ventilatoren erbij. Kamers en kelders werden warm en luid.","Voor wie alleen met een pc delfde, werd het daarna veel moeilijker om nog een blok te vinden."],world:["loterij","De mijnhal"],src:"Algemene geschiedenis van mining.",
  en:{block:"± Block 85,000",date:"2010",title:"Mining with a graphics card",text:"Miners discover that a graphics card guesses much faster. Rooms full of racks of cards.",long:["A graphics card can do thousands of small sums at once. Exactly what mining needs.","In 2010 the first programs for mining with a graphics card appeared. One card was dozens of times faster than a processor.","People built racks with six cards side by side, with fans attached. Rooms and basements became hot and loud.","For anyone still mining with just a PC, finding a block became much harder after that."],src:"General history of mining."}},
 {id:"013",z:"z3",block:"± Blok 135.000",date:"2011",title:"De FPGA: een chip die je instelt",kind:"fpga",text:"Een chip die je zelf kunt programmeren. Zuiniger dan een videokaart.",long:["Een FPGA is een chip die je kunt instellen voor één taak. Voor mining was hij sneller per watt dan een videokaart.","Vanaf 2011 programmeerden techneuten FPGA's speciaal voor de berekening van bitcoin. Ze gebruikten veel minder stroom.","Ze waren duur en lastig om in te stellen. Het bleef iets voor liefhebbers.","De FPGA was een tussenstap: hij liet zien dat een chip die alleen bitcoin kan, veel efficiënter is. Dat leidde naar de ASIC."],world:["loterij","De mijnhal"],src:"Algemene geschiedenis van mining.",
  en:{block:"± Block 135,000",date:"2011",title:"The FPGA: a chip you configure",text:"A chip you can program yourself. More efficient than a graphics card.",long:["An FPGA is a chip you can configure for a single task. For mining it was faster per watt than a graphics card.","From 2011, engineers programmed FPGAs specifically for bitcoin's calculation. They used far less electricity.","They were expensive and tricky to set up. It stayed a hobby for enthusiasts.","The FPGA was a stepping stone: it showed that a chip that only does bitcoin is far more efficient. That led to the ASIC."],src:"General history of mining."}},
 {id:"014",z:"z3",block:"± Blok 217.000",date:"jan 2013",title:"De ASIC: een chip alleen voor bitcoin",kind:"asic",text:"Een chip die maar één ding kan: bitcoin delven. Daarna kon niemand meer thuis meedoen.",long:["Begin 2013 kwamen de eerste ASIC-miners. Ze zijn duizenden keren sneller dan een pc.","Een ASIC is een chip die maar één ding kan: de berekening van bitcoin. Het Chinese bedrijf Canaan leverde in januari 2013 de eerste, de Avalon.","Daarna kon niemand thuis met een pc of videokaart nog meekomen. Mining werd een bedrijf met hallen vol machines, vaak waar stroom goedkoop is.","Moderne miners staan bij waterkrachtcentrales, gasvelden die anders affakkelen en zonneparken. Ze kunnen in seconden aan en uit, wat ze handig maakt voor het stroomnet."],world:["loterij","De mijnhal"],src:"Algemene geschiedenis van mining.",
  en:{block:"± Block 217,000",date:"Jan 2013",title:"The ASIC: a chip just for bitcoin",text:"A chip that can do only one thing: mine bitcoin. After that, nobody could keep up at home.",long:["The first ASIC miners arrived in early 2013. They are thousands of times faster than a PC.","An ASIC is a chip that can do only one thing: bitcoin's calculation. The Chinese company Canaan delivered the first one, the Avalon, in January 2013.","After that, nobody could keep up at home with a PC or graphics card. Mining became an industry with halls full of machines, often where power is cheap.","Modern miners sit next to hydro plants, gas fields that would otherwise flare, and solar parks. They can switch on and off in seconds, which makes them useful for the power grid."],src:"General history of mining."}},
 {id:"015",z:"z3",block:"Blok 972.543",date:"okt 2026",title:"Hashrate: duizend triljoen gokken per seconde",kind:"counter",text:"Zo vaak gokt het hele netwerk nu per seconde. Het getal hiernaast telt mee.",long:["De rekenkracht van het netwerk heet hashrate. In oktober 2026 lag die rond 1.000 EH/s: duizend triljoen gokken per seconde.","Elke gok is een poging om een getal te vinden dat aan de regels van het volgende blok voldoet. Gemiddeld wint er elke tien minuten één miner, en die mag het blok toevoegen.","Hoe hoger de hashrate, hoe sterker het netwerk. Wie het kasboek wil vervalsen, heeft meer rekenkracht nodig dan alle andere miners bij elkaar. Bij dit tempo kost dat miljarden aan machines en stroom, en dat maakt aanvallen onbetaalbaar."],world:["loterij","De mijnhal"],src:"mempool.space, oktober 2026.",
  en:{block:"Block 972,543",date:"Oct 2026",title:"Hashrate: a sextillion guesses a second",text:"That's how often the whole network guesses each second right now. The number next to it keeps counting.",long:["The computing power of the network is called the hashrate. In October 2026 it was around 1,000 EH/s: a sextillion (10²¹) guesses per second.","Each guess is an attempt to find a number that meets the rules for the next block. On average one miner wins every ten minutes and gets to add the block.","The higher the hashrate, the stronger the network. Anyone who wants to forge the ledger needs more computing power than all other miners combined. At this rate that costs billions in machines and power, which makes an attack unaffordable."],src:"mempool.space, October 2026."}},
 /* Zaal 4 */
 {id:"016",z:"z4",block:"± Blok 245.000",date:"2013",title:"De weggegooide harde schijf",kind:"hdd",text:"Een man gooit per ongeluk een harde schijf weg met 8.000 bitcoin erop. Hij ligt nog op een vuilnisbelt in Wales.",long:["James Howells uit Newport delfde in 2009 zo'n 8.000 bitcoin op zijn laptop. Later haalde hij de computer uit elkaar en bewaarde de harde schijf in een la.","In 2013 gooide hij die schijf per ongeluk weg tijdens het opruimen. Hij belandde op de vuilnisbelt van zijn stad, onder tonnen afval.","Jarenlang probeerde hij toestemming te krijgen om de stortplaats te doorzoeken, met plannen voor robots en investeerders. De gemeente weigerde, om redenen van milieu en veiligheid.","In 2025 verloor hij zijn rechtszaak en ook het hoger beroep. Zijn verhaal laat zien: wie de sleutel kwijt is, krijgt de bitcoin nooit meer terug."],world:["sleutel","De kluis"],src:"Publieke berichtgeving.",
  en:{block:"± Block 245,000",date:"2013",title:"The hard drive in the landfill",text:"A man accidentally throws away a hard drive with 8,000 bitcoin on it. It is still in a landfill in Wales.",long:["James Howells from Newport mined about 8,000 bitcoin on his laptop in 2009. Later he took the computer apart and kept the hard drive in a drawer.","In 2013 he threw that drive away by accident while tidying up. It ended up in his city's landfill, under tonnes of rubbish.","For years he tried to get permission to search the site, with plans for robots and investors. The council refused, for environmental and safety reasons.","In 2025 he lost his court case and his appeal. His story shows: if you lose the key, you never get the bitcoin back."],src:"Public reporting."}},
 {id:"017",z:"z4",block:"± Blok 286.000",date:"feb 2014",title:"Het faillissement van Mt. Gox",kind:"collapse",text:"De grootste beurs gaat failliet. Zo'n 850.000 bitcoin zijn weg.",long:["In februari 2014 konden klanten van Mt. Gox hun bitcoin niet meer opnemen. Kort daarna ging de beurs failliet.","Zo'n 850.000 bitcoin waren verdwenen. Hackers hadden er jarenlang ongemerkt bitcoin uit gehaald, en de beurs had het niet in de gaten.","Later werd zo'n 200.000 bitcoin teruggevonden in een oude wallet. Na tien jaar kregen klanten vanaf 2024 een deel van hun geld terug.","Les die bleef hangen: wie de sleutel niet zelf heeft, vertrouwt een ander. Not your keys, not your coins."],world:["sleutel","De kluis"],src:"Publieke bronnen over Mt. Gox.",
  en:{block:"± Block 286,000",date:"Feb 2014",title:"The collapse of Mt. Gox",text:"The biggest exchange goes bankrupt. About 850,000 bitcoin are gone.",long:["In February 2014, Mt. Gox customers could no longer withdraw their bitcoin. Soon after, the exchange went bankrupt.","About 850,000 bitcoin had disappeared. Hackers had been draining bitcoin unnoticed for years, and the exchange had not spotted it.","Later, around 200,000 bitcoin was found in an old wallet. After ten years, customers started getting part of their money back in 2024.","The lesson that stuck: if you don't hold the key yourself, you are trusting someone else. Not your keys, not your coins."],src:"Public sources on Mt. Gox."}},
 {id:"018",z:"z4",block:"Altijd",date:"",title:"De herstelzin: 12 of 24 woorden",kind:"plate",text:"12 of 24 woorden die je sleutel terug kunnen maken. Kwijt is kwijt.",long:["Veel wallets geven je een rijtje woorden. Daarmee haal je je sleutel terug als je telefoon kapotgaat.","De woorden komen uit een vaste lijst van 2.048 Engelse woorden. Twaalf woorden geven zoveel mogelijke combinaties dat niemand ze ooit kan raden.","Wie de woorden heeft, heeft de bitcoin. Daarom vraagt geen echte wallet of helpdesk er ooit om. Wie erom vraagt, wil je bestelen.","Mensen stansen ze in staal, zodat ze brand en water overleven. Nooit in een foto, mail of cloud."],world:["sleutel","De kluis"],src:"Algemene praktijk.",
  en:{block:"Always",date:"",title:"The recovery phrase: 12 or 24 words",text:"12 or 24 words that can rebuild your key. Lost is lost.",long:["Many wallets give you a list of words. They let you restore your key if your phone breaks.","The words come from a fixed list of 2,048 English words. Twelve words give so many possible combinations that nobody can ever guess them.","Whoever has the words has the bitcoin. That's why no real wallet or helpdesk will ever ask for them. Anyone who asks wants to rob you.","People stamp them into steel so they survive fire and water. Never in a photo, email or cloud."],src:"Common practice."}},
 {id:"019",z:"z4",block:"± Blok 558.000",date:"jan 2019",title:"QuadrigaCX: de sleutels die verdwenen",kind:"key",text:"De oprichter van een Canadese beurs overlijdt. Niemand anders had de sleutels.",long:["Gerald Cotten richtte in 2013 QuadrigaCX op, de grootste bitcoinbeurs van Canada. In december 2018 overleed hij plotseling tijdens een reis in India. De beurs maakte dat pas in januari 2019 bekend.","Cotten beheerde de sleutels van de offline wallets helemaal alleen. Zonder hem kon niemand erbij. Zo'n 76.000 klanten misten samen ruim 200 miljoen Canadese dollar.","Daarna bleek het erger. De Canadese toezichthouder concludeerde in 2020 dat Cotten al jaren met klantengeld speculeerde en geld wegsluisde. De wallets waren grotendeels leeg. Het was geen ongeluk, het was fraude.","De les die bitcoiners sindsdien herhalen: not your keys, not your coins. Laat je bitcoin op een beurs staan, dan vertrouw je erop dat die eerlijk is en goed met de sleutels omgaat. Met je eigen wallet en herstelzin hoeft dat niet."],world:["sleutel","De kluis"],src:"Publieke berichtgeving.",
  en:{block:"± Block 558,000",date:"Jan 2019",title:"QuadrigaCX: the keys that vanished",text:"The founder of a Canadian exchange dies. Nobody else had the keys.",long:["Gerald Cotten founded QuadrigaCX in 2013, Canada's largest bitcoin exchange. In December 2018 he died suddenly while travelling in India. The exchange only announced it in January 2019.","Cotten managed the keys to the offline wallets entirely on his own. Without him, nobody could get in. Around 76,000 customers were missing more than 200 million Canadian dollars between them.","Then it got worse. In 2020, Canada's securities regulator concluded that Cotten had been gambling with customer money for years and siphoning funds off. The wallets were largely empty. It was not an accident, it was fraud.","The lesson bitcoiners have repeated ever since: not your keys, not your coins. Leave your bitcoin on an exchange and you trust it to be honest and careful with the keys. With your own wallet and recovery phrase, you don't have to."],src:"Public reporting."}},
 /* Zaal 5 */
 {id:"020",z:"z5",block:"± Blok 514.000",date:"maart 2018",title:"Lightning: snel en goedkoop betalen",kind:"bolt",text:"Een tweede laag bovenop bitcoin, voor snelle en kleine betalingen.",long:["Lightning houdt betalingen tussen twee mensen even buiten de blockchain. Pas aan het eind komt het totaal erin. Zo kun je in een seconde een paar cent betalen.","Het idee werd in 2016 beschreven door Joseph Poon en Thaddeus Dryja. In 2018 kwam het eerste bruikbare netwerk.","Het werkt als een open rekening tussen twee partijen, en betalingen kunnen via meerdere van die rekeningen springen. Zo bereik je iemand met wie je zelf geen rekening hebt.","Lightning wordt gebruikt voor kleine betalingen, fooien en geld sturen tussen landen. In El Salvador en Zuid-Afrika betalen mensen er koffie en boodschappen mee."],world:["wachtkamer","De wachtkamer"],src:"Algemene bronnen.",
  en:{block:"± Block 514,000",date:"March 2018",title:"Lightning: fast, cheap payments",text:"A second layer on top of bitcoin, for fast and small payments.",long:["Lightning keeps payments between two people off the blockchain for a while. Only the total goes in at the end. That way you can pay a few cents in a second.","The idea was described in 2016 by Joseph Poon and Thaddeus Dryja. The first usable network launched in 2018.","It works like an open tab between two parties, and payments can hop across several of those tabs. That way you can reach someone you don't have a tab with yourself.","Lightning is used for small payments, tips and sending money across borders. In El Salvador and South Africa, people pay for coffee and groceries with it."],src:"General sources."}},
 {id:"021",z:"z5",block:"± Blok 699.500",date:"7 sep 2021",title:"El Salvador maakt bitcoin wettig betaalmiddel",kind:"flag",text:"Het eerste land dat bitcoin wettig betaalmiddel maakt. In 2025 werd de wet aangepast.",long:["Op 7 september 2021 werd bitcoin in El Salvador wettig betaalmiddel, naast de dollar. Winkels moesten het in principe accepteren.","Iedereen die de overheidswallet Chivo downloadde, kreeg 30 dollar aan bitcoin. Het land kocht ook zelf bitcoin voor de staatskas.","Het experiment kreeg veel kritiek, onder andere van het IMF. In ruil voor een lening werd de wet in 2025 aangepast.","Sinds 2025 noemt de wet bitcoin een vrijwillig wettig betaalmiddel. Belasting betalen in bitcoin kan niet meer."],world:["geld","De planeet"],src:"Cointelegraph, januari 2025.",
  en:{block:"± Block 699,500",date:"7 Sep 2021",title:"El Salvador makes bitcoin legal tender",text:"The first country to make bitcoin legal tender. In 2025 the law was changed.",long:["On 7 September 2021, bitcoin became legal tender in El Salvador, alongside the dollar. Shops were in principle required to accept it.","Everyone who downloaded the government wallet Chivo got 30 dollars in bitcoin. The country also bought bitcoin for its treasury.","The experiment drew a lot of criticism, including from the IMF. In return for a loan, the law was changed in 2025.","Since 2025, the law calls bitcoin voluntary legal tender. Paying taxes in bitcoin is no longer possible."],src:"Cointelegraph, January 2025."}},
 {id:"022",z:"z5",block:"± Blok 825.500",date:"11 jan 2024",title:"Bitcoin-ETF's op de Amerikaanse beurs",kind:"etf",text:"In de VS mogen beleggers via de gewone beurs in bitcoin beleggen.",long:["Een ETF is een fonds dat je op de beurs koopt. Sinds januari 2024 kan dat in de VS ook met bitcoin.","Op 10 januari 2024 keurde de Amerikaanse toezichthouder SEC na jaren van afwijzingen elf bitcoin-ETF's tegelijk goed. Een dag later begon de handel.","Grote vermogensbeheerders zoals BlackRock en Fidelity kopen echte bitcoin en bewaren die voor hun beleggers. Binnen een jaar hadden de fondsen samen meer dan een miljoen bitcoin.","Voor pensioenfondsen en banken werd bitcoin zo een gewone belegging. Voor bitcoiners blijft het advies: met een ETF heb je geen eigen sleutel."],world:["walvissen","De oceaan"],src:"Publieke berichtgeving.",
  en:{block:"± Block 825,500",date:"11 Jan 2024",title:"Bitcoin ETFs on the US stock market",text:"In the US, investors can buy bitcoin through the regular stock market.",long:["An ETF is a fund you buy on the stock market. Since January 2024 that has also been possible with bitcoin in the US.","On 10 January 2024, after years of rejections, the US regulator SEC approved eleven bitcoin ETFs at once. Trading started a day later.","Large asset managers such as BlackRock and Fidelity buy real bitcoin and hold it for their investors. Within a year the funds held more than a million bitcoin between them.","For pension funds and banks, bitcoin became an ordinary investment. For bitcoiners the advice stays the same: with an ETF you have no key of your own."],src:"Public reporting."}},
 {id:"023",z:"z5",block:"Blok 840.000",date:"20 apr 2024",title:"De vierde halvering: 3,125 bitcoin",kind:"stairs",text:"De beloning voor miners gaat van 6,25 naar 3,125 bitcoin per blok.",long:["Elke 210.000 blokken halveert de beloning. Blok 840.000 was de vierde keer. De volgende is rond 2028.","Die regel staat sinds het begin in de code. Er komt nooit meer bij dan 21 miljoen bitcoin, en hoe dichter we daarbij komen, hoe trager het gaat.","Na deze halvering komen er per dag zo'n 450 nieuwe bitcoin bij. In 2009 waren dat er 7.200.","Rond 2140 komt de laatste satoshi erbij. Daarna leven miners alleen nog van de transactiekosten. Op de halveringstrap in dit museum loop je dit verloop zelf af."],world:["halvering","De trap"],src:"Blokdata.",
  en:{block:"Block 840,000",date:"20 Apr 2024",title:"The fourth halving: 3.125 bitcoin",text:"The reward for miners goes from 6.25 to 3.125 bitcoin per block.",long:["Every 210,000 blocks the reward halves. Block 840,000 was the fourth time. The next one is around 2028.","That rule has been in the code since the start. There will never be more than 21 million bitcoin, and the closer we get, the slower it goes.","After this halving, about 450 new bitcoin are created per day. In 2009 that was 7,200.","Around 2140 the last satoshi is created. After that, miners live only on transaction fees. On the halving staircase in this museum you can walk this curve yourself."],src:"Block data."}},
 /* Zaal 6 · vleugel Nederland */
 {id:"024",z:"z6",ed:"nl",block:"± Blok 300.000",date:"mei 2014",title:"Arnhem Bitcoinstad",kind:"arnhem",text:"Drie vrienden maken van Arnhem de stad met de meeste winkels die bitcoin aannemen.",long:["Arnhem Bitcoinstad begon in mei 2014 met een kroegentocht. Binnen een jaar deden 50 ondernemers mee: een kapper, een fietsenmaker, een bloemist, zelfs een tandarts.","Het idee kwam van een paar enthousiaste Arnhemmers. Ze gingen langs winkels, legden uit hoe het werkte en hielpen met het installeren van een betaalapp.","Arnhem werd daarmee een van de steden met de meeste bitcoinwinkels ter wereld. Journalisten uit binnen- en buitenland kwamen kijken.","Veel winkels zijn er later weer mee gestopt. Toch geldt Arnhem nog steeds als een vroeg voorbeeld van bitcoin als gewoon betaalmiddel in de straat."],world:["betalen","Het station"],src:"Cointelegraph, februari 2015.",
  en:{block:"± Block 300,000",date:"May 2014",title:"Arnhem Bitcoin City",text:"Three friends turn Arnhem into the city with the most shops accepting bitcoin.",long:["Arnhem Bitcoin City started in May 2014 with a pub crawl. Within a year, 50 businesses took part: a hairdresser, a bike repair shop, a florist, even a dentist.","The idea came from a few enthusiastic locals. They visited shops, explained how it worked and helped install a payment app.","That made Arnhem one of the cities with the most bitcoin shops in the world. Journalists from home and abroad came to see.","Many shops later stopped again. Still, Arnhem remains an early example of bitcoin as everyday money on the high street."],src:"Cointelegraph, February 2015."}},
 {id:"025",z:"z6",ed:"nl",block:"± Blok 332.000",date:"dec 2014",title:"De eerste supermarkt met bitcoin",kind:"cart",text:"Een Spar in Arnhem neemt bitcoin aan. Waarschijnlijk de eerste supermarkt van Nederland.",long:["Een Spar in Arnhem nam eind 2014 bitcoin aan. Het was waarschijnlijk de eerste supermarkt van Nederland die dat deed.","Het was een van de veertig winkels in Arnhem die toen bitcoin aannamen.","Afrekenen ging met een QR-code op een tablet bij de kassa. De klant scande die met zijn telefoon, en binnen een paar seconden was de betaling binnen.","Voor de winkel was het vooral een proef. Het liet zien dat bitcoin werkte voor iets heel gewoons: je dagelijkse boodschappen."],world:["betalen","Het station"],src:"NL Times, 2 december 2014.",
  en:{block:"± Block 332,000",date:"Dec 2014",title:"The first supermarket taking bitcoin",text:"A Spar in Arnhem accepts bitcoin. Probably the first supermarket in the Netherlands.",long:["A Spar supermarket in Arnhem accepted bitcoin at the end of 2014. It was probably the first supermarket in the Netherlands to do so.","It was one of the forty shops in Arnhem accepting bitcoin at the time.","Paying worked with a QR code on a tablet at the till. The customer scanned it with their phone, and within seconds the payment came in.","For the shop it was mainly a trial. It showed that bitcoin worked for something very ordinary: your daily groceries."],src:"NL Times, 2 December 2014."}},
 {id:"026",z:"z6",ed:"nl",block:"± Blok 631.000",date:"21 mei 2020",title:"Verplichte registratie bij DNB",kind:"bank",text:"Bedrijven die in Nederland bitcoin aanbieden, moeten zich laten registreren bij De Nederlandsche Bank.",long:["Dat kwam door Europese regels tegen witwassen. Vanaf 21 mei 2020 moesten bedrijven die in Nederland bitcoin aanbieden zich laten registreren bij De Nederlandsche Bank.","DNB controleerde of bedrijven hun klanten kenden en verdachte transacties meldden. Dat kostte bedrijven veel geld en werk.","Wie zonder registratie doorging, mocht niet meer werken in Nederland. Een paar grote buitenlandse beurzen kregen een boete.","Sinds MiCA, eind 2024, is de AFM de toezichthouder en geldt er een Europese vergunning in plaats van de DNB-registratie."],world:["sleutel","De kluis"],src:"De Nederlandsche Bank.",
  en:{block:"± Block 631,000",date:"21 May 2020",title:"Mandatory registration with DNB",text:"Companies offering bitcoin in the Netherlands must register with the Dutch central bank (DNB).",long:["This came from European anti-money-laundering rules. From 21 May 2020, companies offering bitcoin in the Netherlands had to register with the Dutch central bank, DNB.","DNB checked whether companies knew their customers and reported suspicious transactions. That cost businesses a lot of money and work.","Anyone who carried on without registration was no longer allowed to operate in the Netherlands. A few large foreign exchanges were fined.","Since MiCA, at the end of 2024, the AFM is the supervisor and a European licence has replaced the DNB registration."],src:"De Nederlandsche Bank."}},
 {id:"027",z:"z6",ed:"nl",block:"± Blok 876.000",date:"30 dec 2024",title:"MiCA: Europese regels voor crypto",kind:"stars",text:"Europese regels voor cryptobedrijven gaan gelden. In Nederland houdt de AFM toezicht.",long:["MiCA zorgt voor één set regels in de hele EU. Een bedrijf met een vergunning in één land mag in de hele EU werken.","De regels gelden sinds 30 december 2024. Bedrijven moeten onder meer klantgeld gescheiden bewaren, eerlijk zijn over risico's en een stevige organisatie hebben.","In Nederland houdt de AFM toezicht. Bestaande bedrijven kregen tot halverwege 2025 de tijd om een vergunning te halen.","Voor jou als koper betekent het: kies een aanbieder die in het officiële Europese register staat. Je eigen bitcoin in je eigen wallet valt buiten MiCA."],world:["sleutel","De kluis"],src:"AFM.",
  en:{block:"± Block 876,000",date:"30 Dec 2024",title:"MiCA: Europe's crypto rules",text:"European rules for crypto companies take effect. In the Netherlands, the AFM supervises.",long:["MiCA creates one set of rules across the whole EU. A company with a licence in one country may operate throughout the EU.","The rules have applied since 30 December 2024. Companies must, among other things, keep customer money separate, be honest about risks and have a solid organisation.","In the Netherlands, the AFM supervises. Existing companies had until mid-2025 to get a licence.","For you as a buyer it means: choose a provider listed in the official European register. Your own bitcoin in your own wallet falls outside MiCA."],src:"AFM."}},
 /* Zaal 6 · vleugel Wereld */
 {id:"028",z:"z6",ed:"int",block:"± Blok 266.000",date:"29 okt 2013",title:"De eerste bitcoinautomaat",kind:"atm",text:"In een koffiezaak in Vancouver komt de eerste automaat te staan waar je met contant geld bitcoin koopt.",long:["De automaat stond in Waves Coffee in het centrum van Vancouver, Canada. Hij was gemaakt door het bedrijf Robocoin en werd geplaatst op 29 oktober 2013.","Je stopte er briefjes in en kreeg bitcoin op je eigen adres. Om witwassen te voorkomen scande de automaat je handpalm en je identiteitsbewijs.","Het ging meteen hard: in de eerste dagen werd er voor tienduizenden dollars bitcoin gekocht. Er kwamen al snel meer automaten bij, ook in Europa.","Nu staan er wereldwijd tienduizenden. Let op: automaten rekenen vaak hoge kosten, en oplichters sturen slachtoffers er bewust naartoe."],world:["betalen","Het station"],src:"Wikipedia, Bitcoin ATM; CBC, oktober 2013.",
  en:{block:"± Block 266,000",date:"29 Oct 2013",title:"The first bitcoin ATM",text:"A coffee shop in Vancouver gets the first machine where you buy bitcoin with cash.",long:["The machine stood in Waves Coffee in downtown Vancouver, Canada. It was made by the company Robocoin and installed on 29 October 2013.","You fed it bank notes and received bitcoin at your own address. To prevent money laundering, it scanned your palm and your ID.","It took off immediately: in the first days, tens of thousands of dollars of bitcoin were bought. More machines soon followed, also in Europe.","Today there are tens of thousands worldwide. Note: machines often charge high fees, and scammers deliberately send victims to them."],src:"Wikipedia, Bitcoin ATM; CBC, October 2013."}},
 {id:"029",z:"z6",ed:"int",block:"± Blok 278.000",date:"9 jan 2014",title:"Overstock: de eerste grote webwinkel",kind:"parcels",text:"Overstock, een grote Amerikaanse webwinkel, neemt bitcoin aan. In 21 uur: 780 bestellingen.",long:["Overstock, een grote Amerikaanse webwinkel, nam op 9 januari 2014 als eerste grote winkel bitcoin aan. De betalingen liepen via Coinbase.","Volgens de baas van Overstock, Patrick Byrne, leverde het in de eerste 21 uur 780 bestellingen op, samen 124.000 dollar.","De eerste aankoop met bitcoin: tuinmeubels van 2.700 dollar.","Daarna volgden meer grote bedrijven. Het liet zien dat bitcoin niet alleen voor techneuten was, maar ook voor gewone online winkelaars."],world:["betalen","Het station"],src:"CoinDesk, januari 2014.",
  en:{block:"± Block 278,000",date:"9 Jan 2014",title:"Overstock: the first big web shop",text:"Overstock, a big American online store, accepts bitcoin. In 21 hours: 780 orders.",long:["Overstock, a large American web shop, became the first big retailer to accept bitcoin on 9 January 2014. Payments went through Coinbase.","According to Overstock's CEO Patrick Byrne, it brought in 780 orders in the first 21 hours, worth 124,000 dollars in total.","The first purchase with bitcoin: garden furniture for 2,700 dollars.","More big companies followed. It showed that bitcoin was not just for techies, but also for ordinary online shoppers."],src:"CoinDesk, January 2014."}},
 {id:"030",z:"z6",ed:"int",block:"± Blok 690.000",date:"2021",title:"Salaris in bitcoin in Zuid-Afrika",kind:"surf",text:"In Mossel Bay, Zuid-Afrika, krijgen de medewerkers van een surfclub hun hele salaris in bitcoin.",long:["Bitcoin Ekasi begon in 2021 in een township bij Mossel Bay, Zuid-Afrika, bij een stichting die jongeren laat surfen. De medewerkers kregen hun salaris in bitcoin.","Ekasi betekent ongeveer 'in de buurt'. Het idee was een kleine economie waarin mensen bitcoin verdienen, sparen en uitgeven, zonder bankrekening.","Kleine buurtwinkels, spaza shops, nemen bitcoin aan via Lightning. Zo kunnen medewerkers hun loon in de buurt uitgeven.","De jongeren leren er ook over sparen en over het bewaren van een eigen sleutel. Het project dient als voorbeeld voor andere gemeenschappen in Afrika."],world:["geld","De planeet"],src:"Mariblock; Trezor-blog.",
  en:{block:"± Block 690,000",date:"2021",title:"Salaries in bitcoin in South Africa",text:"In Mossel Bay, South Africa, the staff of a surf club get their full salary in bitcoin.",long:["Bitcoin Ekasi started in 2021 in a township near Mossel Bay, South Africa, at a foundation that teaches young people to surf. The staff received their salaries in bitcoin.","Ekasi roughly means 'in the neighbourhood'. The idea was a small economy in which people earn, save and spend bitcoin, without a bank account.","Small local shops, spaza shops, accept bitcoin via Lightning. That way staff can spend their wages in the neighbourhood.","The young people also learn about saving and about keeping their own key. The project serves as an example for other communities in Africa."],src:"Mariblock; Trezor blog."}},
 {id:"031",z:"z6",ed:"int",block:"± Blok 726.000",date:"maart 2022",title:"Lugano: de stad die bitcoin aanneemt",kind:"arcade",text:"De Zwitserse stad Lugano kondigt aan dat je er met bitcoin kunt betalen, ook belasting.",long:["In maart 2022 kondigde de Zwitserse stad Lugano Plan ₿ aan, samen met Tether. Inwoners en bedrijven zouden belasting en andere betalingen in bitcoin kunnen doen.","Honderden winkels en restaurants in Lugano nemen inmiddels bitcoin aan. De stad organiseert elk jaar een groot bitcoinforum.","In oktober 2024 onthulde de stad een standbeeld van Satoshi Nakamoto in een park aan het meer.","De Zwitserse frank blijft het enige wettige betaalmiddel. Een tussenpartij wisselt de bitcoin om, zodat de stad francs ontvangt."],world:["geld","De planeet"],src:"FXStreet, maart 2022.",
  en:{block:"± Block 726,000",date:"March 2022",title:"Lugano: the city that takes bitcoin",text:"The Swiss city of Lugano announces that you can pay with bitcoin there, including taxes.",long:["In March 2022, the Swiss city of Lugano announced Plan ₿, together with Tether. Residents and businesses would be able to pay taxes and other bills in bitcoin.","Hundreds of shops and restaurants in Lugano now accept bitcoin. The city hosts a large bitcoin forum every year.","In October 2024, the city unveiled a statue of Satoshi Nakamoto in a park by the lake.","The Swiss franc remains the only legal tender. A payment provider converts the bitcoin, so the city receives francs."],src:"FXStreet, March 2022."}}

const POSTER_EL={}; Object.keys(POSTER_IMG).forEach(k=>{ const im=new Image(); im.src=POSTER_IMG[k][0]; POSTER_EL[k]=im; });
function posterCanvas(k){ const im=POSTER_EL[k], c=document.createElement("canvas"); c.width=im.naturalWidth||2000; c.height=im.naturalHeight||2828; const x=c.getContext("2d"); x.drawImage(im,0,0);
  /* lichte papierkorrel, zodat het als een print voelt */
  const n=document.createElement("canvas"); n.width=n.height=256; const nx=n.getContext("2d"), d=nx.createImageData(256,256); for(let i=0;i<d.data.length;i+=4){ const v=Math.random()*255; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=14; } nx.putImageData(d,0,0);
  x.globalCompositeOperation="multiply"; x.fillStyle=x.createPattern(n,"repeat"); x.fillRect(0,0,c.width,c.height); x.globalCompositeOperation="source-over"; return c; }
const POSTERS={}; Object.keys(POSTER_IMG).forEach(k=>POSTERS[k]=()=>posterCanvas(k));
async function take(i){
  const p=P(PRODUCTS[i]); const c=POSTERS[p.draw]();
  let dl=null; try{ if(window.claude&&window.claude.use) dl=await window.claude.use("downloads"); }catch(e){ dl=null; }
  if(!dl){ openObj(p.id); toast(U("hold")); return; }
  c.toBlob(async b=>{ try{ await dl.save({filename:p.file,data:b}); Sound.till(); toast(U("taken")); }catch(e){ if(e&&e.code==="declined") return; openObj(p.id); } },"image/png");
}
